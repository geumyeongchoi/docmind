spring:
  application.name: docmind
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/docmind}
    username: ${DB_USER:docmind}
    password: ${DB_PASSWORD:docmind}
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:                            # 사용하지 않는 OpenAI 부가 모델 자동구성 비활성(키 없이도 기동)
      audio.speech: none
      audio.transcription: none
      image: none
      moderation: none
    vectorstore:
      pgvector:
        initialize-schema: false        # 스키마는 Flyway가 관리(tsvector 생성 컬럼 포함) — ADR 데이터 설계 §9
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        schema-validation: true
  servlet.multipart:
    max-file-size: 50MB
    max-request-size: 200MB
  task.execution.pool:
    core-size: 2
    max-size: 2
    queue-capacity: 100
  ai.mcp.server:
    enabled: true
    name: docmind
    version: 0.1.0
    type: SYNC
    sse-endpoint: /sse
    sse-message-endpoint: /mcp/message
    capabilities:
      tool: true

docmind:
  ingest:
    chunk-size-tokens: 600            # 평가 축: 300 / 600 / 1000
    chunk-overlap-tokens: 80
    embedding-batch-size: 32
  retrieval:
    top-k: 6
    similarity-threshold: 0.35
    hybrid: true                      # false면 벡터 단독(평가 비교용)
    rrf-k: 60
  chat:
    max-memory-messages: 20           # 10턴 = 20 메시지
  safeguard:
    echo-length: 12                   # 답변이 문서 속 지시문과 정규화 후 이 길이 이상 일치하면 폐기(출력 후처리 가드)
    sensitive-phrases:
      - "ignore previous instructions"
      - "ignore all previous instructions"
      - "이전 지시를 무시"
      - "이전 지시는 무시"
      - "시스템 프롬프트를 출력"

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true

logging.level:
  dev.gychoi.docmind: INFO
  org.springframework.ai: INFO

# ──────────────────────────────────────────────────────────────────────────────
# 모델 선택은 아래 프로파일 하나로 결정된다:  --spring.profiles.active=private | public | claude
#   private : Ollama 로컬 (chat gemma3:4b · embedding bge-m3)        — 데이터가 서버 밖으로 안 나감
#   public  : OpenAI/ChatGPT (chat gpt-4.1-mini · embedding text-embedding-3-small)  — OPENAI_API_KEY
#   claude  : Anthropic Claude (chat) + Ollama bge-m3 (embedding)     — ANTHROPIC_API_KEY
# 모델명·엔드포인트는 전부 환경변수로 덮어쓴다(OLLAMA_CHAT_MODEL, OPENAI_CHAT_MODEL, ANTHROPIC_CHAT_MODEL, OLLAMA_URL …).
# 코드는 ChatModel/EmbeddingModel 인터페이스만 보므로 공급자를 바꿔도 소스 변경은 없다(README §4).
# ──────────────────────────────────────────────────────────────────────────────
---
# 사내망: 데이터가 서버 밖으로 나가지 않음
spring:
  config.activate.on-profile: private
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat.options.model: ${OLLAMA_CHAT_MODEL:gemma3:4b}   # qwen3 는 thinking 기본 → 응답 100초+ (README §5)
      embedding.options.model: ${OLLAMA_EMBED_MODEL:bge-m3}
    vectorstore.pgvector:
      table-name: docmind_private
      dimensions: 1024                # bge-m3
docmind.profile-label: private

---
# 공개: 최신 상용 모델
spring:
  config.activate.on-profile: public
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat.options.model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
      embedding.options.model: ${OPENAI_EMBED_MODEL:text-embedding-3-small}
    vectorstore.pgvector:
      table-name: docmind_public
      dimensions: 1536                # text-embedding-3-small
docmind.profile-label: public

---
# Claude(Anthropic): 답변 생성만 외부, 임베딩·문서는 로컬(Ollama bge-m3, docmind_private 공유)
#   → private 로 올린 문서를 재인제스트 없이 그대로 쓰고, 외부로 나가는 것은 "질문 + 검색된 청크"뿐.
#   임베딩까지 OpenAI 로 두고 싶으면 spring.ai.model.embedding=openai + table docmind_public + dimensions 1536 + docmind.index-label=public
spring:
  config.activate.on-profile: claude
  ai:
    model:
      chat: anthropic
      embedding: ollama
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat.options:
        model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-4-5}
        max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init.pull-model-strategy: never
      embedding.options.model: ${OLLAMA_EMBED_MODEL:bge-m3}
    vectorstore.pgvector:
      table-name: docmind_private
      dimensions: 1024
docmind:
  profile-label: claude
  index-label: private

---
# 테스트: 모델 자동구성 끄고 가짜 모델 빈 사용(test 소스의 FakeAiConfig)
spring:
  config.activate.on-profile: test
  ai:
    model:
      chat: none
      embedding: none
    vectorstore.pgvector:
      table-name: docmind_public
      dimensions: 1536
docmind.profile-label: test
